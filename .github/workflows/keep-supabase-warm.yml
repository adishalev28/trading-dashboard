name: Keep Supabase Warm

# Supabase free-tier projects nap when idle, and the first request after
# inactivity can take 10-15s. This workflow pings the database every 5
# minutes so the project never gets a chance to sleep — users never see
# a cold start on sign-in.
#
# Cost: $0. The repo is public so Actions minutes are unlimited.
# GitHub's free-tier cron is best-effort and can drift up to ~10 min,
# but for "keep alive" purposes that's plenty of margin.

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # also let us run it on-demand

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read 1 row)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_BULLISH }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_BULLISH }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL_BULLISH or SUPABASE_ANON_KEY_BULLISH secret"
            exit 1
          fi
          # Hit the REST API. allowed_users has RLS that will return an empty
          # array for the anon role — but the query still executes, which is
          # all we need to keep the DB awake.
          response=$(curl -s -o /dev/null -w "%{http_code}|%{time_total}" \
            "${SUPABASE_URL}/rest/v1/allowed_users?select=email&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          status=$(echo "$response" | cut -d'|' -f1)
          time=$(echo "$response" | cut -d'|' -f2)
          echo "Status: $status  Time: ${time}s"
          # 200 = data returned, 200 with empty array = blocked by RLS (still fine).
          # 401/403 = key wrong. 5xx = server problem.
          if [ "$status" -ge 500 ]; then
            echo "::error::Supabase returned $status"
            exit 1
          fi
