name: Monthly Learning Report

# Measures every dashboard list against SPY once a month -> research/monthly/YYYY-MM.md
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 2 * *'   # 2nd of the month, 06:00 UTC - after month-end data is in

concurrency:
  group: refresh-data     # same group as the data refresh, so pushes never race
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Build the report
        run: python scripts/monthly_review.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Commit the report
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add research/monthly
          git diff --cached --quiet && exit 0
          git commit -m "research: monthly learning report ($(date -u +%Y-%m))"
          git pull --rebase --autostash origin main
          git push
